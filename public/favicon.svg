<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Rich Pantone 165 C violin body gradient -->
    <linearGradient id="violinBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A29" />
      <stop offset="50%" stop-color="#FF5F00" />
      <stop offset="100%" stop-color="#D64800" />
    </linearGradient>

    <!-- Fingerboard / Ebony gradient -->
    <linearGradient id="ebonyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2D32" />
      <stop offset="100%" stop-color="#0E0E10" />
    </linearGradient>
  </defs>

  <!-- Violin oriented diagonally across 64x64 square to maximize size and occupy 100% of space -->
  <g transform="translate(32, 32) rotate(-45) scale(0.935)">
    <!-- Subtle high-contrast white contour for dark mode browser tabs -->
    <path
      d="
        M 0, -14
        C 4, -14  8, -13  11, -9
        C 14, -5  14, 0   11, 4
        C 10, 5   8.5, 6  8, 8
        C 7, 10   9, 13   11, 15
        C 16, 19  16.5, 27  14, 34
        C 11, 41  5, 43.5   0, 43.5
        C -5, 43.5 -11, 41 -14, 34
        C -16.5, 27 -16, 19 -11, 15
        C -9, 13  -7, 10  -8, 8
        C -8.5, 6 -10, 5  -11, 4
        C -14, 0  -14, -5 -11, -9
        C -8, -13 -4, -14  0, -14
        Z
      "
      fill="none"
      stroke="#FFFFFF"
      stroke-width="3.8"
      stroke-linejoin="round"
      opacity="0.9"
    />

    <!-- Endpin -->
    <ellipse cx="0" cy="45" rx="2.2" ry="3" fill="#18181B" stroke="#000000" stroke-width="0.8" />

    <!-- Main Violin Body in Pantone 165 C -->
    <path
      d="
        M 0, -14
        C 4, -14  8, -13  11, -9
        C 14, -5  14, 0   11, 4
        C 10, 5   8.5, 6  8, 8
        C 7, 10   9, 13   11, 15
        C 16, 19  16.5, 27  14, 34
        C 11, 41  5, 43.5   0, 43.5
        C -5, 43.5 -11, 41 -14, 34
        C -16.5, 27 -16, 19 -11, 15
        C -9, 13  -7, 10  -8, 8
        C -8.5, 6 -10, 5  -11, 4
        C -14, 0  -14, -5 -11, -9
        C -8, -13 -4, -14  0, -14
        Z
      "
      fill="url(#violinBodyGrad)"
      stroke="#121214"
      stroke-width="2.2"
      stroke-linejoin="round"
    />

    <!-- Purfling border line -->
    <path
      d="
        M 0, -12
        C 3.5, -12 7, -11 9.5, -7.5
        C 12, -4   12, 0   9.5, 3
        C 8, 4.5   6.8, 6  6.5, 8
        C 6, 9.5   7.5, 12 9.5, 13.8
        C 14, 17.5 14.5, 25 12, 31.5
        C 9.5, 38  4, 40.5  0, 40.5
        C -4, 40.5 -9.5, 38 -12, 31.5
        C -14.5, 25 -14, 17.5 -9.5, 13.8
        C -7.5, 12 -6, 9.5  -6.5, 8
        C -6.8, 6  -8, 4.5  -9.5, 3
        C -12, 0   -12, -4  -9.5, -7.5
        C -7, -11  -3.5, -12 0, -12
        Z
      "
      fill="none"
      stroke="#6B2200"
      stroke-width="0.8"
      opacity="0.75"
    />

    <!-- Chinrest -->
    <path
      d="M -3.5, 34 C -2, 32 3, 31 6, 33 C 9, 35 9.5, 39 8, 42 C 5, 43 0, 43 -3.5, 41 Z"
      fill="#1A1A1E"
      stroke="#FFFFFF"
      stroke-width="0.6"
    />
    <path
      d="M 6.5, 34 C 7.5, 36 7.5, 39 6.5, 41"
      stroke="#404048"
      stroke-width="0.7"
      fill="none"
    />

    <!-- Left F-Hole -->
    <g fill="#121214" stroke="#121214" stroke-width="0.3">
      <circle cx="-5.8" cy="8" r="1.1" />
      <path d="M -5.8, 8 C -4.8, 12 -3.5, 15 -6.2, 20 C -7.5, 22.5 -8.2, 24 -7.2, 26" stroke-width="1.3" fill="none" stroke-linecap="round" />
      <path d="M -6.8, 15 L -5, 14.5" stroke-width="0.9" />
      <circle cx="-7.2" cy="26" r="1.3" />
    </g>

    <!-- Right F-Hole -->
    <g fill="#121214" stroke="#121214" stroke-width="0.3">
      <circle cx="5.8" cy="8" r="1.1" />
      <path d="M 5.8, 8 C 4.8, 12 3.5, 15 6.2, 20 C 7.5, 22.5 8.2, 24 7.2, 26" stroke-width="1.3" fill="none" stroke-linecap="round" />
      <path d="M 6.8, 15 L 5, 14.5" stroke-width="0.9" />
      <circle cx="7.2" cy="26" r="1.3" />
    </g>

    <!-- Neck wood -->
    <rect x="-2.2" y="-30" width="4.4" height="20" fill="#D64800" stroke="#121214" stroke-width="0.8" />

    <!-- Ebony Fingerboard -->
    <polygon
      points="-2.6,-28  2.6,-28  3.6,11  -3.6,11"
      fill="url(#ebonyGrad)"
      stroke="#000000"
      stroke-width="1.2"
    />
    <line x1="0" y1="-27" x2="0" y2="10" stroke="#44444C" stroke-width="0.8" opacity="0.6" />

    <!-- Pegbox -->
    <rect x="-2.8" y="-39" width="5.6" height="11" rx="0.5" fill="#121214" stroke="#000000" stroke-width="1.2" />
    <rect x="-1.8" y="-38" width="3.6" height="9" fill="#FF5F00" opacity="0.9" />

    <!-- Tuning Pegs -->
    <path d="M -2.8, -36.5 L -6.5, -36.5" stroke="#121214" stroke-width="1.3" stroke-linecap="round" />
    <circle cx="-7" cy="-36.5" r="1.7" fill="#18181B" stroke="#FFFFFF" stroke-width="0.6" />
    <path d="M -2.8, -31.5 L -6.5, -31.5" stroke="#121214" stroke-width="1.3" stroke-linecap="round" />
    <circle cx="-7" cy="-31.5" r="1.7" fill="#18181B" stroke="#FFFFFF" stroke-width="0.6" />
    <path d="M 2.8, -34 L 6.5, -34" stroke="#121214" stroke-width="1.3" stroke-linecap="round" />
    <circle cx="7" cy="-34" r="1.7" fill="#18181B" stroke="#FFFFFF" stroke-width="0.6" />
    <path d="M 2.8, -29 L 6.5, -29" stroke="#121214" stroke-width="1.3" stroke-linecap="round" />
    <circle cx="7" cy="-29" r="1.7" fill="#18181B" stroke="#FFFFFF" stroke-width="0.6" />

    <!-- Scroll (Spiral Head) with white highlight contour -->
    <path
      d="
        M -2, -39
        C -2, -43 -0.5, -45.5 0, -46
        C 0.8, -46.8 3.5, -46.5 4, -44.5
        C 4.5, -42.5 2.5, -41 1, -41
        C -0.2, -41 -0.8, -42 0, -43
      "
      fill="none"
      stroke="#FFFFFF"
      stroke-width="3.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="
        M -2, -39
        C -2, -43 -0.5, -45.5 0, -46
        C 0.8, -46.8 3.5, -46.5 4, -44.5
        C 4.5, -42.5 2.5, -41 1, -41
        C -0.2, -41 -0.8, -42 0, -43
      "
      fill="none"
      stroke="#121214"
      stroke-width="2.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="
        M -2, -39
        C -2, -43 -0.5, -45.5 0, -46
        C 0.8, -46.8 3.5, -46.5 4, -44.5
        C 4.5, -42.5 2.5, -41 1, -41
        C -0.2, -41 -0.8, -42 0, -43
      "
      fill="none"
      stroke="#FF5F00"
      stroke-width="1.3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Nut -->
    <rect x="-2.6" y="-28.5" width="5.2" height="1" fill="#FFFFFF" opacity="0.95" />

    <!-- Bridge -->
    <path
      d="M -3.8, 15.5 C -1, 14.8 1, 14.8 3.8, 15.5 L 4.2, 17.5 C 2, 17.2 -2, 17.2 -4.2, 17.5 Z"
      fill="#FFE4CC"
      stroke="#121214"
      stroke-width="0.9"
    />
    <rect x="-3.5" y="17.2" width="1.6" height="0.8" fill="#121214" />
    <rect x="1.9" y="17.2" width="1.6" height="0.8" fill="#121214" />

    <!-- Tailpiece -->
    <polygon
      points="-2.6,22  2.6,22  1.6,39  -1.6,39"
      fill="url(#ebonyGrad)"
      stroke="#000000"
      stroke-width="1.1"
    />
    <circle cx="1.6" cy="23.5" r="0.6" fill="#FFFFFF" />
    <circle cx="0.5" cy="23.5" r="0.6" fill="#FFD700" />
    <circle cx="-0.6" cy="23.5" r="0.6" fill="#FFD700" />
    <circle cx="-1.7" cy="23.5" r="0.6" fill="#FFD700" />

    <path d="M -0.8, 39 L -0.6, 43 M 0.8, 39 L 0.6, 43" stroke="#121214" stroke-width="0.8" />

    <!-- 4 Strings (G, D, A, E) -->
    <line x1="1.8" y1="-28" x2="1.6" y2="23" stroke="#FFFFFF" stroke-width="0.75" opacity="0.95" />
    <line x1="0.6" y1="-28" x2="0.5" y2="23" stroke="#F4F4F5" stroke-width="0.85" opacity="0.95" />
    <line x1="-0.6" y1="-28" x2="-0.5" y2="23" stroke="#E4E4E7" stroke-width="0.95" opacity="0.95" />
    <line x1="-1.8" y1="-28" x2="-1.6" y2="23" stroke="#D4D4D8" stroke-width="1.05" opacity="0.95" />
  </g>
</svg>